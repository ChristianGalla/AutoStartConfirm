name: Create release

on:
  workflow_dispatch:

permissions:
  attestations: write
  contents: write
  id-token: write
  
jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      attestation: true
  
  create_release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Version
        run: echo new version ${{ needs.build.outputs.version_number }}
        
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
        
      - name: Download setup artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: AutoStartConfirmSetup
        
      - name: Download framework dependent SBOM artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: FrameworkDependent.sbom.spdx.json
        
      - name: Download standalone SBOM artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: Standalone.sbom.spdx.json
          
      - name: Create tag and release
        run: |
          $v = "${{needs.build.outputs.version_number}}" -split "\."
          $semver = ($v | Select-Object -SkipLast 1) -join "."
          
          # Get the last version tag (matching v<number>.<number>.<number> format)
          $lastTag = git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname --merged HEAD | Select-Object -Index 0

          # Generate release notes grouped by conventional commit type from all commits since the last tag
          $releaseNotes = & "${{ github.workspace }}/Build/Generate-ReleaseNotes.ps1" -LastTag $lastTag -NewTag "v$semver"

          gh release create "v$semver" -d -p --title "$semver" --notes "$releaseNotes" AutoStartConfirmSetup_Standalone.msi AutoStartConfirmSetup_FrameworkDependent.msi Standalone.sbom.spdx.json FrameworkDependent.sbom.spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh        
